<table mat-table [dataSource]="dataSource" class="table mat-elevation-z8">

    <ng-container matColumnDef="eventTitle">
        <th mat-header-cell *matHeaderCellDef> Titel </th>
        <td mat-cell *matCellDef="let element"> {{element.eventTitle}} </td>
    </ng-container>

    <ng-container matColumnDef="eventNote">
        <th mat-header-cell *matHeaderCellDef> Beschreibung </th>
        <td mat-cell *matCellDef="let element"> {{element.eventNote}} </td>
    </ng-container>

    <ng-container matColumnDef="startDateTime">
        <th mat-header-cell *matHeaderCellDef> Startdatum </th>
        <td mat-cell *matCellDef="let element"> {{element.startDateTime}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element">
            <div class="action-buttons">
                <button mat-icon-button aria-label="Kalender anzeigen" matTooltip="Zu Event springen"
                (click)="goToDate(element.startDateTime)">
                    <mat-icon>event</mat-icon>
                </button>
                <button mat-icon-button aria-label="Löschen" matTooltip="Löschen" class="delete-button"
                (click)="delete(element.eventId)">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
