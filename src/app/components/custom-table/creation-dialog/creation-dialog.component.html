<h1 mat-dialog-title>Neue Tabelle erstellen</h1>

<form mat-dialog-content [formGroup]="form">
    <mat-form-field style="width: 100%;">
        <mat-label>Tabellenname</mat-label>
        <input matInput maxlength="100" formControlName="tableName" (input)="onInput('tableName', $event)" required />
        <mat-hint>{{ values()['tableName'].length }}/100</mat-hint>
        <mat-error>Tabellenname ist erforderlich!</mat-error>
    </mat-form-field>

    <div class="second-row">
        <mat-form-field>
            <mat-label>Spaltenname der 1. Spalte</mat-label>
            <input matInput maxlength="100" formControlName="columnName" (input)="onInput('columnName', $event)" required />
            <mat-hint>{{ values()['columnName'].length }}/100</mat-hint>
            <mat-error>Spaltenname ist erforderlich!</mat-error>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Kategorie</mat-label>
            <mat-select formControlName="columnDataType">
                @for (type of dataTypes; track type) {
                    <mat-option [value]="type.value">{{ type.label }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </div>
</form>
    
    <div mat-dialog-actions>
    <button mat-button (click)="cancel()">Abbrechen</button>
    <button mat-flat-button
        (click)="save()"
        [disabled]="this.form.invalid"
        >
        Erstellen
    </button>
</div>
