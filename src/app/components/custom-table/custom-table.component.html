<div class="custom-table-container">
    <mat-toolbar class="toolbar-container">
        <button mat-fab extended matTooltip="Öffne eine Liste aller Tools" (click)="openSideNav()" style="height: 50px; margin-right: 80px;">
            <mat-icon>home</mat-icon>
            Tool wechseln
        </button>

        <div>
            <button mat-flat-button (click)="createTable()">Tabelle erstellen</button>
        </div>
    </mat-toolbar>

    <div class="content-container">
        <mat-card>
            <mat-list class="list">
                <div mat-subheader>Tabellenübersicht</div>
                @if (tableList.length > 0) {
                    @for (table of tableList; track $index) {
                        <button mat-fab extended style="width: 100%;" (click)="loadTable(table.tableId)">
                            <mat-icon matListItemIcon>chevron_right</mat-icon>
                            <span matListItemTitle>{{table.name}}</span>
                        </button>
                    }
                } @else {
                    <p>Keine Tabellen vorhanden!</p>
                }
            </mat-list>
        </mat-card>

        @if (this.tableId != 0) {

            <div class="shadow">
                <table mat-table [dataSource]="dataSource" class="table">
                    @for (col of columns; track $index) {
                        <ng-container [matColumnDef]="col.columnId.toString()">
                            <th mat-header-cell *matHeaderCellDef> {{col.columnName}} </th>
                            <td mat-cell *matCellDef="let row"> {{row.cells[col.columnId]}} </td>
                        </ng-container>
                    }
                    
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
                
                <div class="table-footer">
                    <button mat-flat-button (click)="addColumn()">
                        <mat-icon>view_column</mat-icon>
                        Spalte hinzufügen
                    </button>
                    
                    <button mat-raised-button (click)="addRow()">
                        <mat-icon>add</mat-icon>
                        Neue Zeile hinzufügen
                    </button>
                    
                    <span class="flex-spacer"></span>
                    
                    <button mat-flat-button class="delete-button">
                        <mat-icon>delete</mat-icon>
                        Tabelle löschen
                    </button>
                </div>
            </div>
        }
    </div>
</div>
