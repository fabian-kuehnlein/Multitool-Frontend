<mat-grid-list cols="2" rowHeight="2:1">
    @for (tool of tools; track $index) {
        <mat-grid-tile class="grid-tile">
            <mat-card class="tool-card">
                <mat-card-header class="card-header">
                    <button mat-fab (click)="goTo(tool.route)">
                        <mat-icon>{{ tool.icon }}</mat-icon>
                    </button>
                    <mat-card-title>{{ tool.title }}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <div [innerHTML]="tool.preview"></div>
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>
    }
</mat-grid-list>
