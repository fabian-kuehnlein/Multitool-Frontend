<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Anmelden</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (isLoading) {
        <div class="loading-overlay">
          <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" [class.hidden]="isLoading">
        <mat-form-field appearance="outline">
          <mat-label>Benutzername</mat-label>
          <input matInput formControlName="username" placeholder="Benutzername">
          @if (loginForm.get('username')?.hasError('required')) {
            <mat-error>
              Benutzername ist erforderlich
            </mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Passwort</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Passwort">
          @if (loginForm.get('password')?.hasError('required')) {
            <mat-error>
              Passwort ist erforderlich
            </mat-error>
          }
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button type="submit" [disabled]="loginForm.invalid || isLoading">
            {{ isLoading ? 'Anmeldung läuft...' : 'Anmelden' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
