<div class="sidenav-container">
    <h2 class="launcher-title">Workspace Tools</h2>

    <div class="tool-grid">
        @for (tool of navigationService.modules; track tool.route) {
            <div
                class="tool-item"
                [class.active]="isCurrentRoute(tool.route)"
                (click)="navigate(tool.route)"
            >
                <div class="tool-icon">
                    <mat-icon>{{ tool.icon }}</mat-icon>
                </div>
                <div class="tool-info">
                    <span class="tool-name">{{ tool.name }}</span>
                    <span class="tool-desc">{{ tool.description }}</span>
                </div>
                @if (isCurrentRoute(tool.route)) {
                    <div class="active-indicator"></div>
                }
            </div>
        }
    </div>

    <mat-divider class="sidenav-divider"></mat-divider>

    <div class="action-list">
        <div
            class="tool-item"
            [class.active]="isCurrentRoute('/settings')"
            (click)="navigate('settings')"
        >
            <div class="tool-icon">
                <mat-icon>settings</mat-icon>
            </div>
            <div class="tool-info">
                <span class="tool-name">Einstellungen</span>
                <span class="tool-desc">App konfigurieren</span>
            </div>
            @if (isCurrentRoute('/settings')) {
                <div class="active-indicator"></div>
            }
        </div>

        <div class="tool-item logout-item" (click)="logout()">
            <div class="tool-icon logout-icon">
                <mat-icon>logout</mat-icon>
            </div>
            <div class="tool-info">
                <span class="tool-name">Abmelden</span>
                <span class="tool-desc">Sitzung beenden</span>
            </div>
        </div>
    </div>
</div>
