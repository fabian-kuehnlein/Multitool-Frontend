<div class="calendar-container">
    <mat-toolbar class="toolbar-container">
        <!-- Left Container: Navigation & Views -->
        <div class="left-container">
            <button mat-icon-button matTooltip="Tool wechseln" (click)="openSideNav()" class="sidenav-toggle">
                <mat-icon>menu</mat-icon>
            </button>

            <button mat-stroked-button (click)="calendarAction('today')" [disabled]="isToday()" class="today-button">
                Heute
            </button>

            <mat-button-toggle-group [value]="currentView()" (change)="calendarAction($event.value === 'dayGridMonth' ? 'changeMonth' : 'changeWeek')">
                <mat-button-toggle value="dayGridMonth" matTooltip="Monatsansicht (M)">Monat</mat-button-toggle>
                <mat-button-toggle value="timeGridWeek" matTooltip="Wochenansicht (W)">Woche</mat-button-toggle>
            </mat-button-toggle-group>
        </div>

        <!-- Middle Container: Date Selection -->
        <div class="middle-container">
            <div class="navigation-buttons">
                <button mat-icon-button (click)="calendarAction('prevYear')" matTooltip="Letztes Jahr">
                    <mat-icon>keyboard_double_arrow_left</mat-icon>
                </button>
                <button mat-icon-button (click)="calendarAction('prev')" matTooltip="Letzter Monat">
                    <mat-icon>chevron_left</mat-icon>
                </button>
            </div>

            <h1 class="date-title">{{ title() }}</h1>

            <div class="navigation-buttons">
                <button mat-icon-button (click)="calendarAction('next')" matTooltip="Nächster Monat">
                    <mat-icon>chevron_right</mat-icon>
                </button>
                <button mat-icon-button (click)="calendarAction('nextYear')" matTooltip="Nächstes Jahr">
                    <mat-icon>keyboard_double_arrow_right</mat-icon>
                </button>
            </div>
        </div>

        <!-- Right Container: Actions -->
        <div class="right-container">
            <button mat-flat-button color="primary" (click)='createEvent()' class="create-button" matTooltip="Neuer Eintrag (Alt + N)">
                <mat-icon>add</mat-icon>
                <span>Eintrag erstellen</span>
            </button>
            
            <button mat-icon-button (click)="openSearchResult()" matTooltip="Suche (Alt + F oder /)">
                <mat-icon>search</mat-icon>
            </button>

            <button mat-icon-button (click)="showFilters.set(!showFilters())" [color]="showFilters() ? 'primary' : ''" matTooltip="Filter">
                <mat-icon>filter_list</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    @if (showFilters()) {
        <div class="filter-bar" @fadeSlideInOut>
            <div class="filter-chips">
                <span class="filter-label">Kategorien:</span>
                @if (categoryList().length > 0) {
                    <mat-chip-listbox [formControl]="categoryControl" multiple>
                        @for (category of categoryList(); track category.id) {
                            <mat-chip-option [value]="category.id" [selectable]="true">
                                <span class="color-dot" [style.background-color]="category.color"></span>
                                {{ category.name }}
                            </mat-chip-option>
                        }
                    </mat-chip-listbox>
                } @else {
                    <span class="no-categories">Keine Kategorien vorhanden</span>
                }
            </div>
            <button mat-icon-button (click)="showFilters.set(false)" class="close-filter">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    }
    
    <div class="calendar-wrapper">
        <full-calendar #calendarRef [options]="calendarOptions"></full-calendar>
    </div>
</div>
