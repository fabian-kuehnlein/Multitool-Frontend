<div class="settings-page-container">
    <!-- Toolbar Header -->
    <mat-toolbar class="toolbar-container" [class.mobile-toolbar]="isMobile()">
        @if (isMobile()) {
            <div class="mobile-header">
                <div class="left-actions">
                    <button
                        matIconButton
                        (click)="openSideNav()"
                        aria-label="Hauptmenü öffnen"
                    >
                        <mat-icon>home</mat-icon>
                    </button>
                    <span class="mobile-title">Einstellungen</span>
                </div>
            </div>
        } @else if (isTablet()) {
            <div class="mobile-header">
                <div class="left-actions">
                    <button
                        matIconButton
                        (click)="openSideNav()"
                        aria-label="Hauptmenü öffnen"
                    >
                        <mat-icon>home</mat-icon>
                    </button>
                    <span class="mobile-title">Einstellungen</span>
                </div>
            </div>
        } @else {
            <div class="left-container">
                <button
                    matIconButton
                    matTooltip="Tool wechseln"
                    (click)="openSideNav()"
                    class="sidenav-toggle"
                    aria-label="Hauptmenü öffnen"
                >
                    <mat-icon>home</mat-icon>
                </button>
            </div>
            <div class="middle-container">
                <h1 class="page-title">Einstellungen</h1>
            </div>
            <div class="right-container"></div>
        }
    </mat-toolbar>

    <!-- Main Content Area -->
    <main class="main-content-container">
        <mat-tab-group
            class="settings-tabs-group"
            animationDuration="200ms"
            [selectedIndex]="selectedTabIndex()"
            (selectedIndexChange)="onTabChange($event)"
        >
            <!-- Tab 1: General -->
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon class="tab-label-icon">tune</mat-icon>
                    <span>Allgemein</span>
                </ng-template>

                <div class="tab-content-container">
                    <!-- Section: Appearance -->
                    <div id="section-appearance" class="settings-section">
                        <div class="section-header-wrapper">
                            <h2 class="section-title">Erscheinungsbild</h2>
                            <p class="section-subtitle">
                                Passe das visuelle Design und Theme der Anwendung an.
                            </p>
                        </div>

                        <app-appearance-settings></app-appearance-settings>
                    </div>

                    <!-- Section: Work Time Planner -->
                    <div id="section-worktime" class="settings-section">
                        <div class="section-header-wrapper">
                            <h2 class="section-title">Arbeitszeitplaner</h2>
                            <p class="section-subtitle">
                                Verwalte die Arbeitszeiteinstellung deines Planers.
                            </p>
                        </div>

                        <app-work-time-settings></app-work-time-settings>
                    </div>
                </div>
            </mat-tab>

            <!-- Tab 2: Categories -->
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon class="tab-label-icon">category</mat-icon>
                    <span>Kategorien</span>
                </ng-template>

                <app-categories></app-categories>
            </mat-tab>
        </mat-tab-group>
    </main>
</div>
