<h2 mat-dialog-title>Einstellungen</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="settings-form">
        <div class="form-section">
            <h3 class="section-title">Sollzeit</h3>
            <div class="time-row">
                <mat-form-field appearance="outline" class="half-field">
                    <mat-label>Stunden</mat-label>
                    <input
                        matInput
                        type="number"
                        formControlName="dailyTargetHours"
                        min="1"
                        max="12"
                    />
                </mat-form-field>
                <mat-form-field appearance="outline" class="half-field">
                    <mat-label>Minuten</mat-label>
                    <input
                        matInput
                        type="number"
                        formControlName="dailyTargetMinutes"
                        min="0"
                        max="59"
                    />
                </mat-form-field>
            </div>
        </div>

        <div class="form-section">
            <h3 class="section-title">Pausenregeln</h3>
            <mat-form-field appearance="outline" class="full-field">
                <mat-label>Pause ab 6h (Minuten)</mat-label>
                <input
                    matInput
                    type="number"
                    formControlName="breakRule6h"
                    min="0"
                />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-field">
                <mat-label>Pause ab 9h (Minuten)</mat-label>
                <input
                    matInput
                    type="number"
                    formControlName="breakRule9h"
                    min="0"
                />
            </mat-form-field>
        </div>

        <div class="form-section">
            <h3 class="section-title">Homeoffice</h3>
            <mat-form-field appearance="outline" class="full-field">
                <mat-label>Max. HO-Tage pro Monat</mat-label>
                <input
                    matInput
                    type="number"
                    formControlName="homeOfficeLimit"
                    min="0"
                />
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button (click)="close()">Abbrechen</button>
    <button mat-flat-button (click)="save()" [disabled]="form.invalid">
        <mat-icon>save</mat-icon>
        Speichern
    </button>
</mat-dialog-actions>
