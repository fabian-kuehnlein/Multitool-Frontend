<div class="confirm-dialog-container">
    <div class="dialog-header">
        <div class="icon-container" [class.destructive]="isDestructive">
            <mat-icon>{{ isDestructive ? "warning" : "info" }}</mat-icon>
        </div>
        <h2 mat-dialog-title>{{ title }}</h2>
    </div>

    <mat-dialog-content class="dialog-content">
        <p>{{ message }}</p>
    </mat-dialog-content>

    <mat-dialog-actions class="dialog-actions">
        <button matButton (click)="dialogRef.close(false)" class="cancel-btn">
            {{ cancelText }}
        </button>
        <button
            matButton="filled"
            (click)="dialogRef.close(true)"
            class="confirm-btn"
            [class.delete-colors]="isDestructive"
        >
            {{ confirmText }}
        </button>
    </mat-dialog-actions>
</div>
