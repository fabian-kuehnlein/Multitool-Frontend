@if (!this.data) {
    <h2 mat-dialog-title class="header">Bist du dir sicher?</h2>
} @else {
    <h2 mat-dialog-title class="header">Achtung</h2>
    <mat-dialog-content>
        <p>Der Datentyp dieser Spalte wird geändert.</p>
        <p>Dadurch werden alle bisherigen Inhalte unwiderruflich gelöscht.</p>
        <p>Möchtest du wirklich fortfahren?</p>
    </mat-dialog-content>
        
}


<mat-dialog-actions class="actions">
    <button mat-flat-button mat-dialog-close>Abbrechen</button>
    <button mat-flat-button [mat-dialog-close]="true" class="delete-button">{{ !this.data ? 'Löschen' : 'Änderung bestätigen'}}</button>
</mat-dialog-actions>
