<div class="sidenav-container">
    <h2 class="launcher-title">Workspace Tools</h2>
    
    <div class="tool-grid">
        @for (tool of tools; track tool.route) {
            <div class="tool-item" 
                 [class.active]="isCurrentRoute(tool.route)"
                 (click)="!isCurrentRoute(tool.route) && navigate(tool.route)"
                 [mat-dialog-close]="true">
                <div class="icon-wrapper">
                    <mat-icon>{{tool.icon}}</mat-icon>
                </div>
                <div class="tool-info">
                    <span class="tool-name">{{tool.title}}</span>
                    <span class="tool-desc">{{tool.description}}</span>
                </div>
                @if (isCurrentRoute(tool.route)) {
                    <div class="active-indicator"></div>
                }
            </div>
        }
    </div>
</div>
